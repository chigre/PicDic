// PicDic图片词典，全局显示配置
// Mdict for Android下建议关闭双击放大
window._dictConfig_global = {
    DebugPanel_display: false,        // 显示调试面板（true 开启，false 关闭）
    maxHistorySize: 50,        // 历史记录最大条数
    defaultPageValue: 'lastWord',        // PicDic启动时打开首选词典显示的页面（可选：'firstContent'(首页)、'cover'(封面)、'lastWord'(末次查词页面)）
    preloadPages: 1,        // 预先加载相邻页面数（0 表示不预加载，1 表示前后各加载 1 页）
    enableDoubleTapZoom: true,        // 双击放大（true 开启，false 关闭）
    enableClickPageTurn: true,        // 单击翻页（true 开启，false 关闭）
    enableLongPressZoom: true,        // 长按放大（true 开启，false 关闭）
    longPressDelay: 300,        // 长按延迟（毫秒）
    showZoomButtons: false,        // 双击放大后启用缩放按钮（true 开启，false 关闭）
    zoomStep: 0.1,        // 按钮缩放倍数（按钮模式下每次点击 +/− 的缩放步进值）
    swipeEnabled: true,        // 启用滑动翻页（true 开启，false 关闭）
    swipeThreshold: 30,        // 滑动翻页触发阈值（水平滑动超过此像素数即触发）
    enableInputDebounce: false,        // 搜索框输入内容自动搜索（true 开启，false 关闭）
    inputDebounceDelay: 1000,        // 搜索框输入内容自动搜索的延迟时间（毫秒）（输入停止后多少ms自动搜索）
    enableExpandOnZoom: true,   // 是否启用放大时扩展高度，充分利用屏幕
    darkModeFollowApp: false,        // 跟随App的夜间模式（GoldenDict for Android 需放置 article-style-night.css 至 sdcard/GoldenDict/.config）
    darkMode: false,        // 单独暗色模式（当 darkModeFollowApp 为 false 时才可以自由设定，true 开启，false 关闭）
    darkModeFilter: 'invert(0.9) brightness(1.1)',        // 暗色模式滤镜（默认设置推荐适用于透明背景图片，可选择其他滤镜预设，也可以自定义）
    darkModeBgColor: '#2b2b2b',        // 暗色背景（透明背景适用）
    lightModeBgColor: '#f5e6d3',        // 浅色背景（透明背景适用）
    defaultDictId: null,        // 默认词典ID（不用设置）
    dictGroupOrder: null,        // 语言对分组的排序（不用设置）
    hideDictTitles: true,        // 是否隐藏其他空壳图片词典标题栏，清爽版面
};